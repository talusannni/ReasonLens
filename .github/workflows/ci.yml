name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r sdk/python/requirements.txt
      - run: PYTHONPATH=sdk/python python -m unittest discover sdk/python/tests -v
      - run: python -m py_compile sdk/python/examples/real_application.py sdk/python/examples/document_rag.py sdk/python/examples/generate_document_fixtures.py sdk/python/examples/provenance_edge_cases.py sdk/python/examples/provenance_regression_demo.py sdk/python/examples/run_retrieval_experiments.py sdk/python/tests/test_document_rag.py sdk/python/tests/test_retrieval_experiments.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:provenance
      - run: npm run test:quality-gates
      - run: npm run test:evaluation
      - run: npm run test:evidence-diff
      - run: npm run build
